name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # CHECKOUT
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # PYTHON BACKEND
      # ----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # ----------------------------------------
      # NODE FRONTEND
      # ----------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ----------------------------------------
      # DEPLOYMENT : COPY FILES TO VM
      # ----------------------------------------
      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.UBUNTU }}
          source: |
            backend/**
            frontend/**
            docker-compose.yml
            Dockerfile
          target: /opt/projetIT

      # ----------------------------------------
      # DEPLOYMENT : RUN ON VM
      # ----------------------------------------
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.UBUNTU }}
          script: |
            cd /opt/projetIT
            docker compose down || true
            docker compose pull || true
            docker compose up --build -d
            docker image prune -f
            docker ps
