version: '3.10'

services:
  mongodb:
    image: mongo:latest
    container_name: codearena-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: omar
      MONGO_INITDB_ROOT_PASSWORD: 12345
      MONGO_INITDB_DATABASE: codearena
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - codearena-net

  mongo-express:
    image: mongo-express:latest
    container_name: codearena-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: omar
      ME_CONFIG_MONGODB_ADMINPASSWORD: 12345
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
    depends_on:
      - mongodb
    networks:
      - codearena-net

  backend:
    build: ./backend
    container_name: codearena-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://omar:12345@mongodb:27017/codearena?authSource=admin
    depends_on:
      - mongodb
    networks:
      - codearena-net

  frontend:
    build: ./frontend
    container_name: codearena-frontend
    restart: always
    ports:
      - "5173:5173"   # pour Vite
      # - "3000:3000" # si CRA, décommente
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - codearena-net

volumes:
  mongo-data:

networks:
  codearena-net:
    driver: bridge
